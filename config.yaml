# PDF Download Service Configuration

# PDF Download settings
download:
  base_url: "https://sadcsapi.bydauto.com/file/download?fileUrl="
  storage_path: "/mnt/sdb/bgate/pdf-claims/"  # Production and UAT path
  
  # Download behavior settings
  timeout_seconds: 60
  retry_attempts: 3
  retry_delay_seconds: 5
  
  # Rate limiting to prevent API overload
  delay_between_downloads: 0.5  # seconds between file downloads (0.5 = 500ms)
  delay_between_claims: 0       # seconds between processing different claims

# Database connection pool settings
database:
  # Connection pool configuration
  min_connections: 2        # Minimum connections to maintain in pool
  max_connections: 10       # Maximum connections in pool
  pool_timeout_seconds: 30  # Time to wait for available connection
  
  # Performance tuning
  batch_upsert_size: 500    # Number of claims to process per upsert batch
  max_claims_per_cycle: 10000 # Maximum claims to process in one download cycle
  file_query_batch_size: 500 # Number of claims per DMS file query batch
  
# Scheduler settings
scheduler:
  # Run the check every 2 hours. 
  periodicity_hours: 2
  
  # Prevent overlapping jobs
  max_instances: 1

# Logging configuration
logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "pdf_download_service.log"
  max_file_size_mb: 100
  backup_count: 5

# Monitoring and maintenance
monitoring:
  # Enable statistics logging
  log_statistics: true
  statistics_interval_hours: 24
  
  # Clean up old failed records
  cleanup_enabled: true
  cleanup_interval_days: 7
  cleanup_retention_days: 30

# API settings
api:
  headers:
    User-Agent: "BYD-PDF-Download-Service/1.0"
    Accept: "application/pdf"
    APP_ID: "791565299"
    SECRET_KEY: "1a0fe9add8e3304fb6195d37f3b313bf1ad766d455706ade26f79018c685beed"
  
  # Rate limiting and connection management
  requests_per_minute: 60
  
  # Connection settings
  verify_ssl: true
  allow_redirects: true
  
  # Advanced rate limiting (for poor APIs)
  enable_adaptive_delay: false  # Automatically adjust delay based on error rates
  max_concurrent_requests: 4    # Maximum concurrent requests (for parallel mode)
  delay_on_error_multiplier: 2.0  # Multiply delay by this factor when errors occur

# Error handling
error_handling:
  # How many consecutive failures before alerting
  max_consecutive_failures: 10
  
  # Whether to continue processing other files if one fails
  continue_on_error: true
  
  # Whether to retry failed downloads in the next cycle
  retry_failed_downloads: true

# File validation
file_validation:
  # Minimum file size in bytes (to detect empty or corrupted downloads)
  min_file_size: 1024  # 1KB
  
  # Maximum file size in bytes (to detect potential issues)
  max_file_size: 104857600  # 100MB
  
  # Whether to validate PDF headers
  validate_pdf_format: true

# Performance settings
performance:
  # Database connection pool settings
  db_pool_size: 5
  db_pool_timeout: 60
  
  # Batch processing settings
  batch_size: 20  # Process this many files before committing to DB
  
  # Parallel download settings
  parallel_downloads: true  # Enable multi-threaded downloads
  max_workers: 8  # Number of concurrent download threads (recommend 4-12)
  
  # Memory management
  max_memory_usage_mb: 1024
  
  # Performance logging
  log_detailed_timing: true  # Log detailed timing for each download
  log_performance_summary: true  # Log summary statistics after each cycle

# PDF Processing Pipeline Configuration
pdf_processing:
  # Batch processing settings
  max_claims_per_batch: 10        # Process this many claims at a time
  max_files_per_processing_call: 50  # Pass max this many files to run_batch_processing()
  
  api_enabled: false  # Set to true when PDF processing API is ready
  use_mock_processing: true  # Use mock results for testing
  
  # Processing intervals (in hours)
  interval_hours: 0.5  # How often to run PDF processing
  
  # Processing behavior
  process_immediately_after_download: false  # If true, process PDFs right after downloading a complete claim
  skip_failed_claims: true  # Skip claims that failed processing in previous attempts

# Audit/Matching Pipeline Configuration  
audit_matching:
  # Batch processing settings
  max_claims_per_batch: 100        # Audit this many claims at a time
  
  # Matching intervals (in hours)
  interval_hours: 0.6  # How often to run audit matching (for scheduled runs)
  
  # Auto-run after downloads
  auto_run_after_download: true   # Run audit matching automatically after each download cycle
  
  # Matching behavior
  exact_amount_match: true  # Require exact match for LABOUR_AMOUNT_DMS + PART_AMOUNT_DMS
  tolerance_percentage: 0.0  # Allow this % tolerance for amount matching (0.0 = exact match)
  retry_rejected_claims: false  # Whether to retry claims that were rejected

# PDF Processing Pipeline Configuration

# PDF Processing API Configuration
pdf_processing_api:
  # API connection settings
  base_url: "http://localhost:8888"  # URL of the PDF processing API
  timeout_seconds: 300  # 5 minutes timeout for PDF processing requests
  
  enabled: false
  # Health check settings
  health_check_interval: 60  # Check API health every 60 seconds
  max_retries: 3  # Maximum retries for failed API calls
  retry_delay: 5  # Seconds to wait between retries
  
  # Connection settings
  verify_ssl: true  # Set to false for local development
  connection_timeout: 30  # Seconds to wait for connection
  read_timeout: 300  # Seconds to wait for response
  
  # API endpoints (for future customization)
  endpoints:
    health: "/health"
    single_file: "/process/single"
    claim_batch: "/process/claim"
    batch: "/process/batch"
  
  # Error handling
  continue_on_api_error: true  # Continue processing other claims if API fails for one
  fallback_to_mock: false  # Set to true for testing when API is down
