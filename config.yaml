# Scheduling Configuration
scheduling:
  enabled: true                    # Enable/disable scheduled execution
  interval_minutes: 60            # Run pipeline every X minutes
  run_on_startup: true            # Run immediately when service starts

# Download Configuration
download:
  storage_path: "/mnt/sdb/bgate/pdf-claims/"     # Where to store downloaded PDF files
  batch_size: 20                  # Process this many claims per batch
  max_retries: 3                  # Retry failed downloads
  timeout_seconds: 60             # Timeout for individual file downloads
  delay_between_downloads: 0.5    # Delay between downloads in seconds
  
  # File validation
  min_file_size: 1024             # Minimum file size (1KB)
  max_file_size: 104857600        # Maximum file size (100MB)
  validate_pdf_format: true       # Check PDF file headers
  
  # Performance settings
  parallel_downloads: false       # Enable parallel downloads (set to true for better performance)
  max_workers: 4                  # Number of concurrent download threads

# DMS API Configuration (for file downloads)
dms_api:
  base_url: "https://sadcsapi.bydauto.com/file/download?fileUrl="
  timeout_seconds: 60
  max_retries: 3

# API Configuration
api:
  headers:
    User-Agent: "PDF-DMS-Service/1.0"
    Accept: "application/pdf"
    APP_ID: "791565299" 
    SECRET_KEY: "1a0fe9add8e3304fb6195d37f3b313bf1ad766d455706ade26f79018c685beed"  
  verify_ssl: true
  allow_redirects: true

# PDF Processing Configuration
pdf_processing:
  max_claims_per_batch: 10        # Process this many claims at a time
  ultra_arena_path: "../ultra-arena-frk/Ultra_Arena_Main"  # Path to ultra-arena-frk
  
  # Processing mode selection
  use_api_processing: false       # Set to true to use REST API instead of local processing
  
  # API Configuration (when use_api_processing is true)
  api:
    base_url: "https://your-api-server.com"  # Base URL of your PDF processing API
    endpoint: "/process-pdfs"                 # API endpoint for PDF processing
    timeout_seconds: 300                      # API timeout in seconds
    max_retries: 3                            # Number of retry attempts for failed API calls
    api_key: "your-api-key-here"             # API key for authentication (optional)
    
    # Custom headers (optional)
    custom_headers:
      X-Custom-Header: "custom-value"
      X-Client-ID: "pdf-dms-service"
    
    # Processing options to send to API (optional)
    processing_options:
      enable_ocr: true
      language: "pt-BR"
      confidence_threshold: 0.8
  
  # Fallback options
  use_mock_on_error: true         # Use mock processing if ultra-arena fails
  continue_on_error: true         # Continue with other claims if one fails

# Invoice Matching Configuration
matching:
  max_claims_per_batch: 50        # Match this many claims at a time
  exact_amount_match: true        # Require exact amount matching
  tolerance_percentage: 0.0       # Percentage tolerance for amount differences (0.0 = exact)
  
  # Validation settings
  validate_vin: true              # Validate VIN format
  validate_claim_number: true     # Validate claim number format
  
  # Retry settings
  retry_rejected_claims: false    # Automatically retry rejected claims

# Logging Configuration
logging:
  level: "INFO"                   # DEBUG, INFO, WARNING, ERROR
  file_path: "pdf_dms_service.log"
  max_file_size: 50               # MB
  backup_count: 5                 # Number of log files to keep
  
  # Detailed logging options
  log_database_operations: false  # Log all database queries
  log_processing_details: true    # Log detailed processing information
  log_performance_metrics: true   # Log timing and performance data

# Performance and Resource Management
performance:
  # Database connection settings
  db_connection_timeout: 30       # Seconds
  db_query_timeout: 300          # Seconds for long-running queries
  
  # Memory management
  max_memory_usage_mb: 2048      # Maximum memory usage
  cleanup_temp_files: true       # Clean up temporary files
  
  # Batch processing optimization
  commit_frequency: 10           # Commit database changes every X operations
  progress_report_interval: 5    # Report progress every X items

# Monitoring and Health Checks
monitoring:
  enabled: true                  # Enable health monitoring
  health_check_interval: 300     # Check service health every 5 minutes
  
  # Alerts and notifications
  alert_on_errors: true          # Alert when errors occur
  alert_threshold: 5             # Alert after X consecutive errors
  
  # Statistics collection
  collect_statistics: true       # Collect performance statistics
  statistics_retention_days: 30  # Keep statistics for X days

# Development and Testing Options
development:
  # Mock processing for testing
  use_mock_processing: false      # Force mock processing instead of ultra-arena
  mock_success_rate: 0.7          # Success rate for mock processing (0.0 to 1.0)
  simulate_download_errors: false # Randomly simulate download errors
  
  # Database options
  skip_dms_operations: false     # Skip DMS queries (use local data only)
  dry_run_mode: false           # Don't actually update databases
  
  # Debug options
  verbose_logging: false         # Extra verbose logging
  save_debug_data: false        # Save intermediate processing data
  debug_output_path: "./debug"  # Where to save debug data

# Error Handling and Recovery
error_handling:
  # Retry configuration
  max_retries: 3                # Maximum retries for failed operations
  retry_delay_seconds: 5        # Initial delay between retries
  exponential_backoff: true     # Use exponential backoff for retries
  
  # Failure handling
  continue_on_claim_error: true  # Continue processing other claims if one fails
  mark_failed_claims: true      # Mark failed claims in database
  
  # Recovery options
  auto_recovery: true           # Automatically attempt recovery
  recovery_check_interval: 3600 # Check for recovery opportunities every hour

# Security and Access Control
security:
  # Database security
  encrypt_connections: false    # Use encrypted database connections
  connection_validation: true   # Validate database connections
  
  # File security
  secure_file_storage: false   # Use encrypted file storage
  file_permissions: "644"      # Default file permissions
  
  # Access logging
  log_access_attempts: false   # Log all database access attempts
  audit_trail: false          # Maintain detailed audit trail

# Integration Settings
integrations:
  # Ultra Arena integration
  ultra_arena:
    enabled: true              # Enable ultra-arena-frk integration
    config_file: "config.yaml" # Ultra Arena config file (if needed)
    timeout_seconds: 300       # Timeout for ultra-arena processing
  
  # External API integrations (for future use)
  external_apis:
    enabled: false            # Enable external API integrations
    timeout_seconds: 30       # Default API timeout
    
# Data Retention and Cleanup
data_retention:
  # File retention
  keep_pdf_files_days: 90      # Keep downloaded PDF files for X days
  cleanup_old_files: true     # Automatically clean up old files
  
  # Database retention
  keep_processing_results_days: 365  # Keep processing results for X days
  archive_old_data: false     # Archive old data instead of deleting
  
  # Log retention
  keep_logs_days: 30          # Keep log files for X days
  compress_old_logs: true     # Compress old log files